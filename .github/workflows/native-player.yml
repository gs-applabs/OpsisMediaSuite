name: Native playback host CI
on:
  push:
    paths: ['native-player/**', '.github/workflows/native-player.yml']
  pull_request:
    paths: ['native-player/**', '.github/workflows/native-player.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and audit native dependencies
        shell: pwsh
        run: |
          dotnet restore native-player/Opsis.NativePlayer.csproj -r win-x64
          if ($LASTEXITCODE) { throw 'restore failed' }
          dotnet list native-player/Opsis.NativePlayer.csproj package --vulnerable --include-transitive 2>&1 | Tee-Object audit.txt
          if ($LASTEXITCODE -or (Select-String -Path audit.txt -Pattern '\bHigh\b|\bCritical\b' -Quiet)) { throw 'native dependency audit failed' }
      - name: Build native host
        run: dotnet publish native-player/Opsis.NativePlayer.csproj -c Release -r win-x64 --self-contained true -o native-player/publish
      - name: Generate real multitrack MKV
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE) { throw 'ffmpeg install failed' }
          Set-Content -Encoding utf8 -Path fixture.srt -Value @('1','00:00:00,200 --> 00:00:04,000','Καλημέρα')
          ffmpeg -hide_banner -v error -y -f lavfi -i testsrc2=size=320x180:rate=25:duration=5 -f lavfi -i sine=frequency=440:duration=5 -f lavfi -i sine=frequency=880:duration=5 -i fixture.srt -map 0:v -map 1:a -map 2:a -map 3:s -c:v libx264 -pix_fmt yuv420p -c:a aac -c:s srt fixture.mkv
          if ($LASTEXITCODE) { throw 'fixture failed' }
      - name: Real LibVLC playback and track selection
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path native-player/publish/Opsis.NativePlayer.exe) -ArgumentList @('--selftest', ('"' + (Resolve-Path fixture.mkv).Path + '"')) -PassThru -NoNewWindow -RedirectStandardOutput native-result.json -RedirectStandardError native-error.log
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'native timeout' }
          Get-Content native-result.json,native-error.log
          if ($p.ExitCode -ne 0) { throw "native test failed: $($p.ExitCode)" }
      - name: Explicit DirectShow graph test (Windows built-in filters)
        shell: pwsh
        run: |
          ffmpeg -hide_banner -v error -y -f lavfi -i sine=frequency=440:duration=3 -c:a pcm_s16le fixture.wav
          if ($LASTEXITCODE) { throw 'WAV fixture failed' }
          $p = Start-Process -FilePath (Resolve-Path native-player/publish/Opsis.NativePlayer.exe) -ArgumentList @('--directshow-selftest', ('"' + (Resolve-Path fixture.wav).Path + '"')) -PassThru -NoNewWindow -RedirectStandardOutput directshow-result.json -RedirectStandardError directshow-error.log
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'DirectShow timeout' }
          Get-Content directshow-result.json,directshow-error.log
          if ($p.ExitCode -ne 0) { throw "DirectShow test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-host-test-evidence
          path: |
            audit.txt
            native-result.json
            native-error.log
            directshow-result.json
            directshow-error.log
