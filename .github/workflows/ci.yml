name: Opsis 2.4.1 NET 11 audit Windows x64 test download

on:
  push:
    branches: [codex/flyout-test-download]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 098f6939ab86e4aeaa687b6c075aaed320225298
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: npm ci
      - name: Build and test the Windows desktop helper
        shell: pwsh
        run: |
          npm run build:windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $session = (Get-Process -Id $PID).SessionId
          if (!(Get-Process explorer -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session)) {
            Start-Process "$env:WINDIR/explorer.exe"
            Start-Sleep -Seconds 5
          }
          node test/windows-desktop.smoke.js
      - name: Build the portable Windows x64 folder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: npx --no-install electron-builder --win --dir --x64 --publish never '-c.win.signAndEditExecutable=false'
      - name: Verify packaged files and record SHA-256
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/Opsis Media Suite.exe'
          $helper = 'release/win-unpacked/resources/windows-desktop/Opsis.WindowsDesktop.exe'
          if (!(Test-Path $helper) -or !(Test-Path $exe)) { throw 'Missing application or Windows desktop helper' }
          @'
          const asar = require('@electron/asar');
          const pkg = JSON.parse(asar.extractFile('release/win-unpacked/resources/app.asar', 'package.json').toString());
          if (pkg.version !== '2.4.1') throw new Error('Unexpected packaged version ' + pkg.version);
          console.log('Verified packaged Opsis version ' + pkg.version);
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Opsis Media Suite.exe" | Set-Content -Encoding ascii "$exe.sha256"
      - name: Scan packaged Opsis with Microsoft Defender
        id: defender
        shell: pwsh
        run: |
          'verified=false' >> $env:GITHUB_OUTPUT
          $svc = Get-Service WinDefend -ErrorAction SilentlyContinue
          if (!$svc -or $svc.Status -ne 'Running') {
            Write-Host '::warning::Defender is not running. No executable artifact will be uploaded.'
            return
          }
          $mp = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          if (!(Test-Path $mp)) {
            Write-Host '::warning::Defender scanner is unavailable. No executable artifact will be uploaded.'
            return
          }
          Update-MpSignature -ErrorAction Stop
          & $mp -Scan -ScanType 3 -File (Resolve-Path 'release/win-unpacked').Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender returned exit code $LASTEXITCODE" }
          'verified=true' >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: steps.defender.outputs.verified == 'true'
        with:
          name: OpsisMediaSuite-2.4.1-Net11-Audit-x64
          path: release/win-unpacked/
          if-no-files-found: error
          compression-level: 3
          retention-days: 30
