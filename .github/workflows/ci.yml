name: Opsis Flyout Windows x64 test download

on:
  push:
    branches: [codex/flyout-test-download]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54fd69064243d60416206df6e334eb568dbfb8bb
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - name: Build the portable Windows x64 folder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        shell: pwsh
        run: |
          npm run build:windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install electron-builder --win --dir --x64 --publish never '-c.win.signAndEditExecutable=false'
      - name: Verify packaged files and record SHA-256
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/Opsis Media Suite.exe'
          $helper = 'release/win-unpacked/resources/windows-desktop/Opsis.WindowsDesktop.exe'
          if (!(Test-Path $helper) -or !(Test-Path $exe)) { throw 'Missing application or Windows desktop helper' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Opsis Media Suite.exe" | Set-Content -Encoding ascii 'release/win-unpacked/Opsis Media Suite.exe.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: OpsisMediaSuite-2.4.0-Flyout-test-x64
          path: release/win-unpacked/
          if-no-files-found: error
          compression-level: 3
          retention-days: 30
