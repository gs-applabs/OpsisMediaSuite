name: Installer lifecycle CI (test only)
on:
  pull_request:
    paths: ['.github/workflows/installer-lifecycle-ci.yml','test/build-installer-ci.js','test/installer-lifecycle.ps1','package.json','package-lock.json','renderer/**','main.js','preload.js','native-player/**','conv-*.js','media-main.js','installer/**','music-tags.js','music-library.js','m3u.js','decode-text.js','photo-metadata.js','local-media-policy.js','atomic-write.js','.github/scripts/ensure-ffmpeg.ps1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-lifecycle-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: dotnet publish native-player/Opsis.NativePlayer.csproj -c Release -r win-x64 --self-contained true -o native-player/publish
      - name: Install pinned Inno Setup 7 compiler
        shell: pwsh
        run: |
          # Pinned official release asset digest, retrieved from jrsoftware/issrc
          # tag is-7_1_1. Avoid anonymous API rate limits and mutable metadata.
          $url='https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $sha='8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          $setup=Join-Path $env:RUNNER_TEMP 'inno7.exe'
          Invoke-WebRequest $url -OutFile $setup
          if((Get-FileHash $setup -Algorithm SHA256).Hash -ne $sha){throw 'compiler hash mismatch'}
          $sig=Get-AuthenticodeSignature $setup
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys'){throw 'compiler signature mismatch'}
          $dir=Join-Path $env:RUNNER_TEMP 'inno7'
          $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$dir`"") -PassThru -Wait
          if($p.ExitCode -ne 0 -or !(Test-Path "$dir/ISCC.exe")){throw 'Inno compiler install failed'}
          "OPSIS_ISCC=$dir/ISCC.exe" >> $env:GITHUB_ENV
      - name: Build unsigned Inno Setup version fixtures
        run: |
          node test/build-installer-ci.js 2.4.2
          if ($LASTEXITCODE) { throw 'base fixture build failed' }
          $v=(Get-Content package.json -Raw | ConvertFrom-Json).version
          if($v -notmatch '^3\.0\.0-rc\.[1-9][0-9]{0,3}$'){$v='3.0.0'}
          node test/build-installer-ci.js $v
          if ($LASTEXITCODE) { throw 'upgrade candidate build failed' }
        shell: pwsh
      - name: Stage actual RC installer, portable directory ZIP, source and checksums
        shell: pwsh
        run: |
          $v=(Get-Content package.json -Raw | ConvertFrom-Json).version
          if($v -notmatch '^3\.0\.0-rc\.[1-9][0-9]{0,3}$'){exit 0}
          New-Item -ItemType Directory -Force rc-artifacts | Out-Null
          Copy-Item "release-installer-ci/$v/OpsisMediaSuite-CI-$v.exe" "rc-artifacts/OpsisMediaSuite-Setup-$v.exe"
          Copy-Item LICENSE release/win-unpacked/LICENSE.OpsisMediaSuite.txt
          Copy-Item licenses release/win-unpacked/licenses -Recurse -Force
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath "rc-artifacts/OpsisMediaSuite-Portable-$v.zip"
          git archive --format=zip --prefix="OpsisMediaSuite-$v/" --output="rc-artifacts/OpsisMediaSuite-Source-$v.zip" HEAD
          if($LASTEXITCODE){throw 'source archive failed'}
          npm sbom --omit=dev --sbom-format=cyclonedx | Set-Content -Encoding utf8 rc-artifacts/npm-sbom.cdx.json
          if($LASTEXITCODE){throw 'SBOM generation failed'}
          $sha=(git rev-parse HEAD).Trim()
          Set-Content rc-artifacts/SOURCE-COMMIT.txt $sha
          Get-ChildItem rc-artifacts -File | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Encoding ascii ($_.FullName+'.sha256') "$hash  $($_.Name)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: rc1-unsigned-candidate
          path: rc-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Test installation, upgrade and removal
        shell: pwsh
        run: |
          ./.github/scripts/ensure-ffmpeg.ps1
          ./test/installer-lifecycle.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-lifecycle-evidence
          path: |
            installer-first.log
            installer-upgrade.log
          retention-days: 7


  rc-security:
    needs: lifecycle
    if: always()
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: rc
        shell: pwsh
        run: |
          $v=(Get-Content package.json -Raw | ConvertFrom-Json).version
          "enabled=$($v -match '^3\.0\.0-rc\.[1-9][0-9]{0,3}$')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        if: steps.rc.outputs.enabled == 'true'
        with:
          name: rc1-unsigned-candidate
          path: assets
      - name: Verify artifact source identity
        if: steps.rc.outputs.enabled == 'true'
        shell: pwsh
        run: |
          if((Get-Content assets/SOURCE-COMMIT.txt -Raw).Trim() -ne (git rev-parse HEAD).Trim()){throw 'candidate source mismatch'}
          foreach($file in @(Get-ChildItem assets -File | Where-Object Name -notlike '*.sha256')){
            if(!(Test-Path ($file.FullName+'.sha256'))){throw "Missing checksum: $($file.Name)"}
          }
      - uses: actions/setup-dotnet@v4
        if: always() && steps.rc.outputs.enabled == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Check the candidate SHA-256 files
        if: always() && steps.rc.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = 0
          $files=@(Get-ChildItem assets -File | Where-Object Extension -in '.exe','.zip')
          if(-not $files.Count){throw 'No release binaries to verify'}
          foreach($file in $files){if(-not (Test-Path ($file.FullName+'.sha256'))){Write-Host "MISSING CHECKSUM $($file.Name)";$bad++}}
          Get-ChildItem assets -Filter *.sha256 | ForEach-Object {
            $target = Join-Path assets ($_.Name -replace '\.sha256$','')
            if (Test-Path $target) {
              $want = ((Get-Content $_.FullName -Raw).Trim() -split '\s+')[0].ToLower()
              $got = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
              if ($want -notmatch '^[a-f0-9]{64}$' -or $want -ne $got) { "MISMATCH $($_.Name)"; $bad++ } else { "ok  $($_.Name)" }
            } else { "ORPHAN CHECKSUM $($_.Name)";$bad++ }
          }
          if ($bad) { throw "$bad checksum file(s) do not match" }

      - name: Microsoft Defender scan (fresh signatures)
        if: always() && steps.rc.outputs.enabled == 'true'
        shell: pwsh
        run: |
          # Try to start Defender. Missing service/scanner or unverified scan must fail the security gate.
          try { Set-Service WinDefend -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service WinDefend -ErrorAction SilentlyContinue } catch { }
          $svc = Get-Service WinDefend -ErrorAction SilentlyContinue
          "WinDefend: $($svc.Status)"
          Update-MpSignature -ErrorAction Stop
          $dir = (Resolve-Path assets).Path
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mp)) { $mp = (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Recurse -Filter MpCmdRun.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName }
          if (-not $mp -or -not (Test-Path $mp)) { throw 'Defender is not available on this runner: NOT VERIFIED' }
          $detected = $false
          $scanFiles=@(Get-ChildItem $dir -File | Where-Object Extension -in '.exe','.zip')
          if(-not $scanFiles.Count){throw 'No release binaries to scan'}
          $scanFiles | ForEach-Object {
            $o = & $mp -Scan -ScanType 3 -File $_.FullName -DisableRemediation 2>&1 | Out-String
            $scanExit=$LASTEXITCODE
            "{0}: {1}" -f $_.Name, (($o -split "`r?`n" | Where-Object { $_ -match 'found|no threats|Scan starting|Scan finished|error|0x' } | Select-Object -First 3) -join ' | ')
            if ($o -match 'found \d+ threats' -and $o -notmatch 'found no threats') { $detected = $true; "DETECTED in $($_.Name): $o" }
            elseif ($scanExit -ne 0 -or $o -match '0x8\w+') { throw "Defender could not verify $($_.Name) (exit $scanExit)" }
          }
          if ($detected) { throw 'Defender reported a detection in the release files' }
          'Defender: no detection reported'
      - name: Trace scan inside the portable zips (personal data and build paths)
        if: always() && steps.rc.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $patterns = @('C:\Users\','C:\w\','gstrj','LOGISTIRIO','giorstergiopoulos@gmail','/Users/','D:\a\')
          # D:\a\ is the runner build path of THIS repository's CI; the owner login in a public GitHub URL is not personal data
          $work = Join-Path $env:RUNNER_TEMP 'trace'; New-Item -ItemType Directory -Force $work | Out-Null
          $hits = @()
          Get-ChildItem assets -Filter '*Portable-*.zip' | ForEach-Object {
            $d = Join-Path $work $_.BaseName; Expand-Archive $_.FullName $d -Force
            Get-ChildItem $d -Recurse -File -Include *.exe,*.dll,*.pdb,*.json,*.config,*.js,*.html | ForEach-Object {
              $b = [IO.File]::ReadAllBytes($_.FullName)
              $u8 = [Text.Encoding]::Latin1.GetString($b); $u16 = [Text.Encoding]::Unicode.GetString($b)
              foreach ($p in $patterns) {
                if ($u8.IndexOf($p, [StringComparison]::OrdinalIgnoreCase) -ge 0 -or $u16.IndexOf($p, [StringComparison]::OrdinalIgnoreCase) -ge 0) { $hits += "$($_.Name): contains '$p'" }
              }
            }
          }
          $hits | Sort-Object -Unique | ForEach-Object { "TRACE: $_" }
          if ($hits.Count -gt 0) { throw "$($hits.Count) trace(s) of personal data or build paths inside the release files" }
          'trace scan: clean'

      - name: Secrets scan of the repository (gitleaks)
        if: always() && steps.rc.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $v = '8.21.2'
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_windows_x64.zip" -OutFile gl.zip
          Expand-Archive gl.zip gl -Force
          ./gl/gitleaks.exe detect --source . --no-banner --redact -v --exit-code 1

      - uses: actions/setup-dotnet@v4
        if: always() && steps.rc.outputs.enabled == 'true'
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Known-vulnerable NuGet packages
        if: always() && steps.rc.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $projects = Get-ChildItem opsis-plugin,native-player -Recurse -Filter *.csproj
          if (-not $projects) { throw 'No plugin project found' }
          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE) { throw 'NuGet restore failed' }
            dotnet list $project.FullName package --vulnerable --include-transitive 2>&1 | Tee-Object vuln.txt
            if ($LASTEXITCODE) { throw 'NuGet audit failed' }
            if (Select-String -Path vuln.txt -Pattern '\bHigh\b|\bCritical\b' -Quiet) { throw 'A High/Critical vulnerability is referenced' }
          }
