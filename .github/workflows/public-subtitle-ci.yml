name: Public subtitle HTTPS and renderer CI
on:
  push:
    branches: ['feat/photo-tools-fxsound-coexistence']
    paths: ['.github/workflows/public-subtitle-ci.yml','test/public-subtitle-fixture.js','subtitle-autosync.js','subtitle-sync-worker.js','subtitle-provider.js','renderer/vplib.js','renderer/videoplayer.js']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  public-subtitles:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch and verify public MDN Sintel video and WebVTT over HTTPS
        run: node test/public-subtitle-fixture.js
      - shell: pwsh
        run: ./.github/scripts/ensure-ffmpeg.ps1
      - name: Build native DSP adapter required by shared renderer self-test
        shell: pwsh
        run: |
          cmake -S native-dsp -B native-dsp-build -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { throw 'native DSP configure failed' }
          cmake --build native-dsp-build --config Release
          if ($LASTEXITCODE) { throw 'native DSP build failed' }
          if (-not (Test-Path native-dsp-build/Release/opsis_dsp_pcm.exe)) { throw 'adapter missing' }
      - name: Real Electron playback, public subtitle timing and screenshot
        shell: pwsh
        env:
          OPSIS_PUBLIC_SUBTITLE_FIXTURE: '1'
        run: |
          npm run selftest 2>&1 | Tee-Object public-subtitle-test.log
          if ($LASTEXITCODE) { throw 'Renderer test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-subtitle-render-evidence
          path: |
            public-subtitle-test.log
            public-subtitle-fixture/*.png
            public-subtitle-fixture/sintel-audio-sync.json
